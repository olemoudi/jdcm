name: PWA data

# The PWA (https://makensi.es/jdcm, source in pwa/) cannot read the site: it sends no CORS headers.
# So this job reads its public JSON for the groups in pwa/groups.json with the :pump module (which
# reuses :core: parser, defensive merge, refresh policy, standings) and publishes static JSON on the
# orphan branch `data`, force-pushed as ONE commit every time (the history never grows). The PWA
# reads it from raw.githubusercontent.com, which sends Access-Control-Allow-Origin: * (5-min CDN cache).
#
# Pace (owner, 2026-11-16): every 3 hours, daytime only, 5 runs a day; nothing at night (22-07 Madrid).
# Politeness (CLAUDE.md): one request at a time 1.5 s apart, honest User-Agent, one gentle retry,
# at most 60 requests and 4 minutes per run (pump Limits); core's RefreshPolicy picks the rounds.
# Pushes to `data` start no workflow (ci.yml only runs for main; GITHUB_TOKEN pushes trigger nothing).
on:
  schedule:
    # 06/09/12/15/18 UTC = 07/10/13/16/19 h Madrid in winter, 08/11/14/17/20 h in summer.
    - cron: '7 6-18/3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Refresh this weekend's rounds and the team catalogue even if they are fresh
        type: boolean
        default: false

permissions:
  contents: read

# Never two at once (they would both force-push), and never cancel one half way.
concurrency:
  group: pwa-data
  cancel-in-progress: false

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # GitHub's cron can fire late: a delayed run must never reach the site at night. Manual runs skip this.
      - name: Night guard
        id: guard
        env:
          EVENT: ${{ github.event_name }}
        run: |
          H=$(TZ=Europe/Madrid date +%H)
          if [ "$EVENT" = "schedule" ] && { [ $((10#$H)) -lt 7 ] || [ $((10#$H)) -gt 21 ]; }; then
            echo "It is ${H} h in Madrid: no fetch, no push."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        if: steps.guard.outputs.go == 'true'
        with:
          persist-credentials: false

      # The previous run's output is this run's memory (fetch times, held matches, the catalogue).
      # nextDueAt says when anything falls due: until then there is nothing to do, not even Java.
      - name: Read back the published data
        id: prev
        if: steps.guard.outputs.go == 'true'
        env:
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          PREV="$RUNNER_TEMP/prev"
          mkdir -p "$PREV"
          if git fetch -q --depth=1 origin data 2>/dev/null; then
            git archive FETCH_HEAD | tar -x -C "$PREV"
          else
            echo "No data branch yet: first run."
          fi
          NEXT=$(jq -r '.nextDueAt // 0' "$PREV/index.json" 2>/dev/null || echo 0)
          HELD=$(jq -c '[.groups[].groupId] | sort' "$PREV/index.json" 2>/dev/null || echo none)
          WANT=$(jq -c '[.groups[].groupId] | sort' pwa/groups.json)
          NOW=$(date +%s%3N)
          if [ "$FORCE" != "true" ] && [ "$HELD" = "$WANT" ] && [ "$NEXT" -gt "$NOW" ]; then
            echo "Nothing due until $(date -u -d @$((NEXT / 1000)) +%FT%TZ)."
            echo "due=false" >> "$GITHUB_OUTPUT"
          else
            echo "due=true" >> "$GITHUB_OUTPUT"
          fi

      # The pump is rebuilt only when its code (or :core's) changes; otherwise the cached build runs.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        id: build
        if: steps.prev.outputs.due == 'true'
        with:
          path: pump/build/install/pump
          key: pump-${{ hashFiles('core/src/main/**', 'pump/src/main/**', '**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        if: steps.prev.outputs.due == 'true'
        with:
          distribution: temurin
          java-version: '17'
          cache: ${{ steps.build.outputs.cache-hit != 'true' && 'gradle' || '' }}

      - name: Build the pump
        if: steps.prev.outputs.due == 'true' && steps.build.outputs.cache-hit != 'true'
        run: |
          chmod +x gradlew scripts/gradle_retry.sh
          # Configure on demand: only :core and :pump (the Android module is never configured).
          scripts/gradle_retry.sh --configure-on-demand :pump:installDist

      - name: Fetch what is due
        id: pump
        if: steps.prev.outputs.due == 'true'
        env:
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          ARGS=(--config pwa/groups.json --prev "$RUNNER_TEMP/prev" --out "$RUNNER_TEMP/out" --status-file "$GITHUB_OUTPUT")
          if [ "$FORCE" = "true" ]; then ARGS+=(--force); fi
          pump/build/install/pump/bin/pump "${ARGS[@]}"

      - name: Publish the data branch (one commit, force-pushed)
        if: steps.pump.outputs.publish == 'true'
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/out"
          jq -e '.v == 1 and (.groups | type == "array")' index.json > /dev/null
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "data: $(jq -r .generatedAt index.json)"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/data

      - name: Summary
        if: always() && steps.guard.outputs.go == 'true'
        env:
          DUE: ${{ steps.prev.outputs.due }}
          PUBLISH: ${{ steps.pump.outputs.publish }}
          REQUESTS: ${{ steps.pump.outputs.requests }}
          FETCHED: ${{ steps.pump.outputs.fetched }}
          FAILED: ${{ steps.pump.outputs.failed }}
          STOPPED: ${{ steps.pump.outputs.stopped }}
        run: |
          {
            echo "### PWA data"
            echo "- due: ${DUE:-?} · published: ${PUBLISH:-false}"
            echo "- requests to the site: ${REQUESTS:-0} (fetched ${FETCHED:-0}, failed ${FAILED:-0})"
            if [ -n "${STOPPED:-}" ]; then echo "- stopped early: $STOPPED"; fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${STOPPED:-}" ]; then echo "::warning::the run stopped early: $STOPPED"; fi
