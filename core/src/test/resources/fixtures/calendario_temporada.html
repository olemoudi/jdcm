<!-- Trimmed from https://juegosdeportivos.ecmadrid.org/Calendarios/CalendarioTemporada (2026-11-19): the page script that names the season picker first, then the picker and the competition picker after it. -->
<script>
    function getCalendarioIdTemporadaValue() {
        let instance = $("#datosCalendario #cmbCalendarioTemporada").dxSelectBox("instance");
        return instance ? (instance.option("value") ?? 0) : 12;
    }

    // Por defecto el combo sólo lista las competiciones activas, que son las que busca quien entra a
    // consultar (jugadores, familias...). Las cerradas se ven marcando la casilla.
    function getCalendarioSoloActivasValue() {
        let instance = $("#datosCalendario #chkCalendarioVerCerradas").dxCheckBox("instance");
        return !(instance ? instance.option("value") : false);
    }

    // "TODAS" son las competiciones activas de la temporada activa (ver CalendariosService), así que sólo
    // se ofrece en esa temporada.
    function getCalendarioElementoTodasValue() {
        let idTemporada = getCalendarioIdTemporadaValue();
        return !idTemporada || idTemporada == 12;
    }
</script>
